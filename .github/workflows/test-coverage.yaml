name: Python tests and coverage

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests with coverage
        run: python -m coverage run --source=parkhouse_aggregator,scraping_parkleitsystem,scripts -m unittest discover -s tests -v

      - name: Require 100% line coverage
        run: python -m coverage report --show-missing --fail-under=100