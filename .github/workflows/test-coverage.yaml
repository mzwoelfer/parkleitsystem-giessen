name: Python tests and coverage

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests with coverage
        run: python -m coverage run -m unittest discover -s tests/unit -v

      - name: Require 100% unit logic coverage
        run: python -m coverage report --show-missing --fail-under=100

      - name: Run integration tests
        run: python -m unittest discover -s tests/integration -v